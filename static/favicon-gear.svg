<!-- Dashboard tab icon. Six chunky teeth, not the role icon's eight thin ones:
     at 16px anything finer aliases into a plain circle. The tile is what stays
     legible once the teeth go, so it carries the accent from base.html. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <mask id="gear">
        <rect width="32" height="32" fill="#000"/>
        <g transform="translate(16 16) scale(.78) translate(-16 -16)">
            <g fill="#fff">
                <circle cx="16" cy="16" r="10.4"/>
                <rect x="13" y="1" width="6" height="9" rx="2"/>
                <rect x="13" y="1" width="6" height="9" rx="2" transform="rotate(60 16 16)"/>
                <rect x="13" y="1" width="6" height="9" rx="2" transform="rotate(120 16 16)"/>
                <rect x="13" y="1" width="6" height="9" rx="2" transform="rotate(180 16 16)"/>
                <rect x="13" y="1" width="6" height="9" rx="2" transform="rotate(240 16 16)"/>
                <rect x="13" y="1" width="6" height="9" rx="2" transform="rotate(300 16 16)"/>
            </g>
            <!-- Masked black, so the hole shows the tile rather than a painted circle. -->
            <circle cx="16" cy="16" r="4.4" fill="#000"/>
        </g>
    </mask>
    <rect width="32" height="32" rx="7" fill="#5865f2"/>
    <rect width="32" height="32" rx="7" fill="#fff" mask="url(#gear)"/>
</svg>

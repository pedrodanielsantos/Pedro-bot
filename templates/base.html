<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot_name or "Bot" }} {% block title %}Dashboard{% endblock %}</title>
    {# Per page, so a tab is identifiable by its mark alone. The gear is the default. #}
    <link rel="icon" href="{% block favicon %}/static/favicon-gear.svg{% endblock %}">
    <style>
        /* Served from static/fonts/, for the same reasons as static/vendor/: the
           dashboard works with no internet, and an upstream release cannot change
           what renders without a commit. One family sets the whole interface, so
           these two faces are everything the page loads. */
        @font-face {
            font-family: 'Roboto Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/static/fonts/RobotoMono-Regular.woff2') format('woff2');
        }

        /* Bold is not decoration here: ansi_up renders the log's SGR 1 as one. */
        @font-face {
            font-family: 'Roboto Mono';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/static/fonts/RobotoMono-Bold.woff2') format('woff2');
        }

        :root {
            /* Renders scrollbars and other native UI dark. */
            color-scheme: dark;

            --bg:      #0d0d0d;
            --surface: #161616;
            --border:  #252525;
            --text:    #dcddde;
            --muted:   #72767d;
            --accent:  #5865f2;
            --green:   #57f287;
            --red:     #ed4245;
            --yellow:  #faa61a;
            --radius:  8px;
            /* One spacing step for the whole UI: the page gutter, the gap between
               cards on both axes, and the console's text gutter are all this, so
               nothing sits on an edge the rest of the page doesn't share. */
            --pad: 16px;
            /* How wide the content column is allowed to get. Generous rather than
               narrow: wide enough that a row isn't mostly gap, capped so a very wide
               monitor doesn't stretch everything into air. Tune this one number. */
            --page-max: 1000px;
            /* The whole interface, not just the log. Served by us, so the character
               cell is the same on every platform rather than whatever the OS supplies;
               the old stack stays behind it for the load, and for a failed fetch. */
            --mono:    'Roboto Mono', ui-monospace, SFMono-Regular, 'Consolas', Menlo, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.5;
            /* Stops mobile browsers inflating text on narrow screens. */
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            /* svh is the viewport with the mobile browser's UI showing, so the page
               never starts out taller than the screen. */
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        ::selection { background: rgba(88, 101, 242, 0.35); }

        /* Spans the window and so do its contents: the title and the button sit against
           the page edges on both pages, independent of how wide main is allowed to be. */
        header {
            background: var(--surface);
            padding: 14px var(--pad);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            row-gap: 8px;
            gap: 10px;
        }

        header > a.btn {
            margin-left: auto;
            text-decoration: none;
        }

        /* Baseline, not centre: the title, the subtitle and the icon button are three
           different heights, and centring each box leaves their text and glyphs sitting
           at three different levels. The dot is a shape with no baseline, so it opts
           back out. */
        .header-left {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            row-gap: 8px;
            gap: 10px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
            align-self: center;
        }

        .dot-online  { background: var(--green); }
        .dot-offline { background: var(--red); }

        .header-title { font-weight: 600; font-size: 15px; white-space: nowrap; }
        .header-sub   { color: var(--muted); font-size: 13px; white-space: nowrap; }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
            transition: color 0.12s, background 0.12s;
        }

        .icon-btn:hover { color: var(--text); background: var(--border); }

        /* An icon box has no baseline, so one is synthesized from its bottom edge and
           the glyph lands high against the text. This drops it onto the middle of the
           cap band, where the eye reads it as level. A margin would not do it: under
           baseline alignment the box keeps its offset from the baseline either way. */
        .header-left .icon-btn { position: relative; top: 2px; }

        main {
            width: 100%;
            max-width: var(--page-max);
            margin-inline: auto;
            padding: var(--pad);
            display: flex;
            flex-direction: column;
            gap: var(--pad);
            flex: 1;
        }

        /* Locks the page to one screen so a flexed child can scroll internally. 100vh
           measures as if the mobile browser's UI were hidden, cutting the bottom of the
           page off until it is; dvh tracks it instead. */
        body.fill-viewport      { height: 100vh; height: 100dvh; }
        body.fill-viewport main { min-height: 0; }

        /* The log wants every column it can get, so the console opts out of the cap. */
        body.fill-viewport { --page-max: none; }

        /* Content that is the page itself: flush against the header, no frame of its
           own. The log and the button overlaid on it take the gutter from --pad
           directly, so they share the edge every other page element sits on. */
        main.main-bleed {
            padding: 0;
            position: relative;
        }

        /* A terminal surface, not prose: the character cell (advance width by line box)
           has to stay fixed or the log's ASCII art distorts. */
        .console {
            font-size: 13px;
            line-height: 1.2;
            tab-size: 4;
            white-space: pre;
            overflow: auto;
            overscroll-behavior: contain;
            padding-block: var(--pad);
            flex: 1;
            min-height: 0;
        }

        /* max-content keeps the trailing padding past a long line; 1lh keeps blank
           lines, e.g. inside Lavalink's banner, from collapsing. */
        .console-line {
            display: block;
            width: max-content;
            min-width: 100%;
            min-height: 1lh;
            padding-inline: var(--pad);
        }

        .console-line:hover { background: rgba(255, 255, 255, 0.025); }
        .console-empty      { color: var(--muted); }

        /* Wrapped mode indents continuations so a split record still reads as one. */
        .console.is-wrapped { white-space: pre-wrap; }

        .console.is-wrapped .console-line {
            width: auto;
            padding-left: calc(var(--pad) + 4ch);
            text-indent: -4ch;
        }

        /* Scrolled up means the tail is paused, so this doubles as that indicator. The
           compound selector outweighs the .btn rules further down. Offsets are measured
           in console.html: this sits against main, outside the log's scrollbars. */
        .btn.console-jump {
            position: absolute;
            right: calc(var(--pad) + var(--scrollbar-w, 0px));
            bottom: calc(var(--pad) + var(--scrollbar-h, 0px));
            background: var(--surface);
            opacity: 0;
            pointer-events: none;
            transition: background 0.12s, border-color 0.12s, opacity 0.15s;
        }

        .btn.console-jump.is-visible { opacity: 1; pointer-events: auto; }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: var(--pad);
        }

        .card-stat {
            min-height: 48px;
        }

        .card-stat-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--pad);
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.1;
        }

        .stat-unit { font-size: 14px; font-weight: 400; color: var(--muted); }

        /* Wraps rather than squeezing the buttons, since a narrow screen plus a
           transient badge ("Starting…") can widen the left side past the room. */
        .guild-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        #guild-list:not(:empty) {
            margin-top: 14px;
            border-top: 1px solid var(--border);
        }

        .guild-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
        }

        .guild-item:last-child { border-bottom: none; }
        .guild-name { font-size: 13px; }
        .guild-meta { font-size: 11px; color: var(--muted); }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
        }

        table input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            margin: 0;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg);
            cursor: pointer;
            position: relative;
            vertical-align: middle;
            flex-shrink: 0;
        }

        table input[type="checkbox"]:checked,
        table input[type="checkbox"]:indeterminate {
            background: var(--accent);
            border-color: var(--accent);
        }

        table input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        table input[type="checkbox"]:indeterminate::after {
            content: "";
            position: absolute;
            left: 3px;
            top: 5px;
            width: 6px;
            height: 2px;
            background: white;
        }

        th {
            text-align: left;
            height: 48px;
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        td {
            height: 48px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        /* Separators go between rows, so the last one has nothing to separate. */
        tbody tr:last-child td { border-bottom: none; }

        td.mono { font-size: 12px; }

        tbody tr { transition: background 0.12s; }

        tbody tr:hover,
        tbody tr:has(input[name="cogs"]:checked) { background: rgba(255, 255, 255, 0.03); }

        .actions { display: flex; gap: 6px; justify-content: flex-end; }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:not(:disabled):hover { background: var(--border); }
        .btn:disabled         { opacity: 0.6; cursor: default; }

        .btn .btn-label.htmx-indicator { display: none; }
        .btn.htmx-request .btn-label { display: none; }
        .btn.htmx-request .btn-label.htmx-indicator { display: inline; }

        .btn-fixed-width { min-width: 64px; justify-content: center; }

        .btn-primary                     { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:not(:disabled):hover { background: #4752c4; border-color: #4752c4; }
        .btn-danger                      { border-color: var(--red); color: var(--red); }
        .btn-danger:not(:disabled):hover { background: rgba(237, 66, 69, 0.1); }
        .btn-success                     { background: var(--green); border-color: var(--green); color: #0d2c17; }
        .btn-success:not(:disabled):hover { background: #45d873; border-color: #45d873; }
        .btn-warning                     { border-color: var(--yellow); color: var(--yellow); }
        .btn-warning:not(:disabled):hover { background: rgba(250, 166, 26, 0.1); }

        .badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
        }

        .badge-ok      { background: rgba(87, 242, 135, 0.12); color: var(--green); }
        .badge-error   { background: rgba(237, 66, 69, 0.12);  color: var(--red); }
        .badge-warning { background: rgba(250, 166, 26, 0.12); color: var(--yellow); }

        .error-msg {
            font-size: 11px;
            color: var(--red);
            display: block;
            margin-top: 3px;
        }

    </style>
    <script src="{{ vendor['htmx.org'] }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
</body>
</html>

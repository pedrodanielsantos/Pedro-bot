{% extends "base.html" %}
{% block title %}Console{% endblock %}
{% block body_class %}fill-viewport{% endblock %}
{% block content %}

<header>
    <div class="header-left">
        <div id="header-status-dot" class="dot {{ 'dot-online' if is_ready else 'dot-offline' }}"></div>
        <span class="header-title">{{ bot_name }}</span>
        <span class="header-sub">/ Console</span>
    </div>
    <a href="/" class="btn btn-fixed-width">Dashboard</a>
</header>

<main>
    <pre id="console-log" class="card" data-log-pos="{{ log_pos }}" style="font-family: var(--mono); font-size: 12px; white-space: pre-wrap; flex: 1; min-height: 0; overflow-y: auto;"></pre>
</main>
{% include "partials/console_log.html" %}

<script type="module">
    // ansi_up 6+ is ESM-only (no UMD/global build), hence the module import.
    import { AnsiUp } from "https://unpkg.com/ansi_up@6/ansi_up.js";

    document.addEventListener("DOMContentLoaded", () => {
        const consoleLog = document.getElementById("console-log");
        const ansiUp = new AnsiUp();
        ansiUp.use_classes = false;

        const stickThreshold = 24;
        let stickToBottom = true;

        // Shared by the initial static tail and every live SSE line.
        function appendLine(rawLine) {
            consoleLog.insertAdjacentHTML("beforeend", ansiUp.ansi_to_html(rawLine) + "\n");
        }

        const initialData = document.getElementById("console-log-initial");
        if (initialData) {
            for (const line of JSON.parse(initialData.textContent)) appendLine(line);
        }

        consoleLog.addEventListener("scroll", () => {
            stickToBottom = consoleLog.scrollHeight - consoleLog.scrollTop - consoleLog.clientHeight < stickThreshold;
        });

        consoleLog.scrollTop = consoleLog.scrollHeight;

        // The box flexes to fill main, so resizing the window changes clientHeight
        // without firing a scroll event. Only re-pins if already stuck to the bottom,
        // so a reader scrolled up through history isn't yanked back down.
        window.addEventListener("resize", () => {
            if (stickToBottom) consoleLog.scrollTop = consoleLog.scrollHeight;
        });

        // Starts at the byte offset the static render above already covers, so a
        // reconnect with nothing received live yet still resumes from there instead
        // of jumping to "now" and skipping whatever was logged in the gap (e.g. a
        // web.py reload's own log lines). After the first message, EventSource tracks
        // Last-Event-ID itself and resends it automatically on every reconnect, so
        // nothing further needs to be done here for that.
        const logPos = consoleLog.dataset.logPos;
        const logSource = new EventSource(logPos ? `/console/logs/stream?last_id=${logPos}` : "/console/logs/stream");
        logSource.onmessage = (e) => {
            appendLine(e.data);
            if (stickToBottom) {
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }
        };

        // Mirrors the header dot across tabs.
        const statusDot = document.getElementById('header-status-dot');
        const statusSource = new EventSource('/status/stream');
        statusSource.addEventListener('ready', (e) => {
            const data = JSON.parse(e.data);
            statusDot.className = `dot ${data.ready ? 'dot-online' : 'dot-offline'}`;
        });
    });
</script>

{% endblock %}

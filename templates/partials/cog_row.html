<tr id="cog-{{ extension | replace('.', '-') }}"{% if oob %} hx-swap-oob="true"{% endif %}>
    <td>
        <input type="checkbox" name="cogs" value="{{ extension }}" data-loaded="{{ 'true' if loaded else 'false' }}">
    </td>
    <td class="mono">
        {{ extension | replace('cogs.', '', 1) }}
        {% if badge_remaining %}
            <span hx-get="/cogs/badge/clear"
                hx-trigger="load delay:{{ badge_remaining }}s"
                hx-target="this"
                hx-swap="outerHTML">
                {% if badge_error %}
                <span class="badge badge-error">Error</span>
                <span class="error-msg">{{ badge_error }}</span>
                {% else %}
                <span class="badge badge-ok">Reloaded</span>
                {% endif %}
            </span>
        {% endif %}
    </td>
    <td>
        <div class="actions">
            {% if loaded %}
            <button class="btn btn-fixed-width"
                hx-post="/cogs/reload/{{ extension }}"
                hx-target="#cog-{{ extension | replace('.', '-') }}"
                hx-swap="outerHTML">
                Reload
            </button>
            <button class="btn btn-danger btn-fixed-width"
                hx-post="/cogs/unload/{{ extension }}"
                hx-target="#cog-{{ extension | replace('.', '-') }}"
                hx-swap="outerHTML">
                Unload
            </button>
            {% else %}
            <button class="btn btn-primary btn-fixed-width"
                hx-post="/cogs/load/{{ extension }}"
                hx-target="#cog-{{ extension | replace('.', '-') }}"
                hx-swap="outerHTML">
                Load
            </button>
            {% endif %}
        </div>
    </td>
</tr>

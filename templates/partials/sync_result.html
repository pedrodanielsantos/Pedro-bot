<span id="sync-status"
    {% if sync_remaining %}
    hx-get="/commands/sync/clear"
    hx-trigger="load delay:{{ sync_remaining }}s"
    hx-swap="outerHTML"
    {% endif %}>
    {% if sync_remaining %}
        {% if sync_error %}
        <span class="badge badge-error">Error</span>
        <span class="error-msg">{{ sync_error }}</span>
        {% else %}
        <span class="badge badge-ok">Synced {{ sync_count }} command{{ "" if sync_count == 1 else "s" }}</span>
        {% endif %}
    {% endif %}
</span>
